globs:
  - "posts/**/*.md"
config:
  # Line length — not enforced, blog posts have long lines
  MD013: false
  # Allow duplicate headings (some posts reuse heading text)
  MD024: false
  # Allow trailing punctuation in headings
  MD026: false
  # Allow raw HTML (used in some imported posts)
  MD033: false
  # Allow bare URLs (links without angle brackets)
  MD034: false
  # First heading doesn't need to be h1 (posts use frontmatter title)
  MD041: false
  # Allow heading level jumps (Ghost import artifact)
  MD001: false
  # Allow trailing spaces (Ghost import artifact)
  MD009: false
  # Allow multiple spaces after blockquote symbol (Ghost import artifact)
  MD027: false
  # Allow extra spaces after list markers (Ghost import artifact)
  MD030: false
