name: Accessibility Audit

on:
  push:

jobs:
  a11y:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          PUBLIC_GHOST_URL: ${{ secrets.PUBLIC_GHOST_URL }}
          PUBLIC_GHOST_CONTENT_API_KEY: ${{ secrets.PUBLIC_GHOST_CONTENT_API_KEY }}

      - name: Validate RSS feed
        run: npm run lint:rss

      - name: Serve built site
        run: npx serve dist --listen 4321 &

      - name: Wait for server
        run: npx wait-on http://localhost:4321

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run accessibility audit
        run: npm run a11y -- --sitemap http://localhost:4321/sitemap-0.xml --sitemap-find https://lauralangdon.io --sitemap-replace http://localhost:4321
