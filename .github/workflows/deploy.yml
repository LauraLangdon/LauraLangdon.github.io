name: Deploy

# Builds the Astro site and copies it to the DigitalOcean server whenever
# main changes. Can also be run by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check for tracker links
        run: npm run lint:trackers

      # The build succeeds without this secret, but the subscribe form then
      # posts to "undefined/members/api/..." and silently stops working.
      - name: Require the Ghost URL
        run: test -n "$PUBLIC_GHOST_URL"
        env:
          PUBLIC_GHOST_URL: ${{ secrets.PUBLIC_GHOST_URL }}

      - name: Build site
        run: npm run build
        env:
          PUBLIC_GHOST_URL: ${{ secrets.PUBLIC_GHOST_URL }}

      - name: Refuse to deploy an empty build
        run: test -f dist/index.html

      - name: Set up SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key for 143.198.144.150, so the job only talks to the real server.
          echo '143.198.144.150 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKD6/zBV9ek2NiRwptdUZ4hGXbwf/QNJqvDJl9VWi54U' > ~/.ssh/known_hosts

      - name: Copy build to server
        run: >
          rsync -rlvz --delete
          -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          dist/ deploy@143.198.144.150:/var/www/astro/
